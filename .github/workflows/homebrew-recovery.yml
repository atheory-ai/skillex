name: Recover Homebrew Publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published Skillex version, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-recovery-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish_formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.0.0
        with:
          node-version: 24
      - name: Test release scripts
        run: make test-release-scripts
      - name: Download published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v$VERSION" --pattern checksums.txt --dir release-assets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: atheory-ai/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Render Homebrew formula from published checksums
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/render-homebrew-formula.mjs "$VERSION" release-assets/checksums.txt homebrew-tap/Formula/skillex.rb
      - name: Push formula to Homebrew tap
        working-directory: homebrew-tap
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/skillex.rb
          if git diff --cached --quiet; then
            echo "Formula already publishes Skillex $VERSION."
            exit 0
          fi
          git commit -m "Update skillex to $VERSION"
          git push origin HEAD:main
